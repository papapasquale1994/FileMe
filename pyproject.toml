# Carta d'identità del progetto: nome, versione, librerie necessarie
# e il comando `fileme` che diventa disponibile dopo l'installazione.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileme"
dynamic = ["version"]
description = "Ritrova i tuoi documenti descrivendoli a parole. Tutto in locale."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0",                  # legge il testo dei PDF
    "python-docx>=1.2",            # legge i documenti Word (.docx)
    "openpyxl>=3.1",               # legge i fogli Excel (.xlsx)
    "chromadb>=1.0",               # database vettoriale, salvato su disco
    "sentence-transformers>=5.0",  # calcola gli embedding con un modello locale
]

[project.optional-dependencies]
# Servono solo a chi sviluppa: test e creazione dei documenti di esempio.
dev = [
    "pytest>=8",   # esegue i test automatici
    "fpdf2>=2.8",  # crea PDF di prova
]

[project.scripts]
fileme = "fileme.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fileme.__version__" }

[tool.setuptools.packages.find]
include = ["fileme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
